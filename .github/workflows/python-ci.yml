name: Python CI

on:
  push:
    paths:
      - 'mt5/mt5_copier/**'
  pull_request:
    paths:
      - 'mt5/mt5_copier/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mt5/mt5_copier/python/requirements.txt
          pip install -r mt5/mt5_copier/tests/requirements.txt
      - name: Run tests
        run: bash mt5/mt5_copier/run.sh

